<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - AI 면접코치</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  max-width: 450px;
  width: 100%;
  background: white;
  border-radius: 20px;
  padding: 50px 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.logo {
  text-align: center;
  margin-bottom: 40px;
}

.logo h1 {
  font-size: 32px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

.logo p {
  color: #666;
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 30px;
  background: #f5f5f5;
  border-radius: 12px;
  padding: 4px;
}

.tab {
  flex: 1;
  padding: 12px;
  border: none;
  background: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  color: #666;
  transition: all 0.2s;
}

.tab.active {
  background: white;
  color: #667eea;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 14px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  font-size: 15px;
  transition: border-color 0.2s;
}

.form-group input:focus {
  outline: none;
  border-color: #667eea;
}

.btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  margin-top: 10px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}

.btn:active {
  transform: translateY(0);
}

.error {
  background: #fee;
  color: #c00;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 20px;
  display: none;
}

.error.show {
  display: block;
}

.loading {
  display: none;
  text-align: center;
  padding: 20px;
  color: #666;
}

.loading.show {
  display: block;
}

.footer {
  text-align: center;
  margin-top: 30px;
  color: #999;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>🎓 AI 면접코치</h1>
    <p>학생부종합 전형 면접 대비</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">로그인</button>
    <button class="tab" onclick="switchTab('signup')">회원가입</button>
  </div>

  <div id="error" class="error"></div>
  <div id="loading" class="loading">처리 중...</div>

  <!-- 로그인 폼 -->
  <form id="loginForm" style="display:block;">
    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="loginEmail" placeholder="이메일 주소" required>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="loginPassword" placeholder="비밀번호" required>
    </div>
    <button type="submit" class="btn">로그인</button>
  </form>

  <!-- 회원가입 폼 -->
  <form id="signupForm" style="display:none;">
    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="signupEmail" placeholder="이메일 주소" required>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="signupPassword" placeholder="비밀번호 (최소 6자)" required minlength="6">
    </div>
    <div class="form-group">
      <label>비밀번호 확인</label>
      <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 확인" required minlength="6">
    </div>
    <button type="submit" class="btn">회원가입</button>
  </form>

  <div class="footer">
    Powered by Jobizic © 2026 · AI Interview Coach
  </div>
</div>

<script>
// Supabase 초기화
const SUPABASE_URL = 'https://uflotegcmhkfocvszncd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmbG90ZWdjbWhrZm9jdnN6bmNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyODE2NDksImV4cCI6MjEwNDg1NzY0OX0.zgeE4lgiy1qnynWFcABLLRG09SrFv1zXdtNhWed39_M';

let supabaseClient = null;

// Supabase SDK가 로드되었는지 확인
if (typeof window.supabase !== 'undefined') {
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('✅ Supabase 초기화 완료');
  } catch (error) {
    console.error('❌ Supabase 초기화 실패:', error);
  }
} else {
  console.error('⚠️ Supabase SDK가 로드되지 않았습니다.');
}

// 이미 로그인된 경우 리다이렉트
async function checkExistingSession() {
  if (!supabaseClient) return;

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = 'app.html';
    }
  } catch (error) {
    console.error('세션 체크 실패:', error);
  }
}

checkExistingSession();

// 탭 전환
function switchTab(tab) {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t => t.classList.remove('active'));

  if (tab === 'login') {
    tabs[0].classList.add('active');
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('signupForm').style.display = 'none';
  } else {
    tabs[1].classList.add('active');
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('signupForm').style.display = 'block';
  }

  hideError();
}

// 에러 표시
function showError(message) {
  const errorEl = document.getElementById('error');
  errorEl.textContent = message;
  errorEl.classList.add('show');
}

function hideError() {
  const errorEl = document.getElementById('error');
  errorEl.classList.remove('show');
}

// 로딩 표시
function showLoading() {
  document.getElementById('loading').classList.add('show');
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('signupForm').style.display = 'none';
}

function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}

// 로그인
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  if (!supabaseClient) {
    showError('Supabase가 초기화되지 않았습니다.');
    return;
  }

  showLoading();

  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      hideLoading();
      switchTab('login');
      showError('로그인 실패: ' + error.message);
    } else {
      window.location.href = 'app.html';
    }
  } catch (error) {
    hideLoading();
    switchTab('login');
    showError('로그인 오류: ' + error.message);
  }
});

// 회원가입
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  if (!supabaseClient) {
    showError('Supabase가 초기화되지 않았습니다.');
    return;
  }

  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

  if (password !== passwordConfirm) {
    showError('비밀번호가 일치하지 않습니다.');
    return;
  }

  showLoading();

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      hideLoading();
      switchTab('signup');
      showError('회원가입 실패: ' + error.message);
    } else {
      // 회원가입 성공 → 가이드 페이지로 이동
      window.location.href = 'guide.html';
    }
  } catch (error) {
    hideLoading();
    switchTab('signup');
    showError('회원가입 오류: ' + error.message);
  }
});
</script>

</body>
</html>
