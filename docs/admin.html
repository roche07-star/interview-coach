<script>

// Î°úÍ∑∏?ÑÏõÉ
async function handleLogout() {
  const { error } = await supabaseClient.auth.signOut();
  if (error) {
    showToast('error', 'Î°úÍ∑∏?ÑÏõÉ ?§Ìå®');
  } else {

}

// Í∂åÌïú Ï≤¥ÌÅ¨
async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  if (session.user.email !== ADMIN_EMAIL) {
    alert('Í¥ÄÎ¶¨Ïûê Í∂åÌïú???ÜÏäµ?àÎã§.');
    window.location.href = 'app.html';
    return;
  }

  return session.user;
}

// ?µÍ≥Ñ Î°úÎìú
async function loadStats() {
  try {
    // Ï¥??†Ï? ??(Supabase Auth Admin API??anon keyÎ°úÎäî ?ëÍ∑º Î∂àÍ?)
    // ?Ä??students ?åÏù¥Î∏îÏùò Í≥†Ïú† user_id ?òÎ? ?¨Ïö©
    const { data: users, error: usersError } = await supabaseClient
      .from('students')
      .select('user_id');

    if (!usersError && users) {
      const uniqueUsers = new Set(users.map(u => u.user_id));
      document.getElementById('totalUsers').textContent = uniqueUsers.size;
    }

    // Ï¥??ôÏÉùÎ∂Ä ??    const { count: studentsCount, error: studentsError } = await supabaseClient
      .from('students')
      .select('*', { count: 'exact', head: true });

    if (!studentsError) {
      document.getElementById('totalStudents').textContent = studentsCount || 0;
    }

    // Ï¥?ÏßàÎ¨∏ ??    const { count: questionsCount, error: questionsError } = await supabaseClient
      .from('questions')
      .select('*', { count: 'exact', head: true });

    if (!questionsError) {
      document.getElementById('totalQuestions').textContent = questionsCount || 0;
    }

    // Ï¥?Î©¥Ï†ë ?∞Ïäµ ??    const { count: interviewsCount, error: interviewsError } = await supabaseClient
      .from('interviews')
      .select('*', { count: 'exact', head: true });

    if (!interviewsError) {
      document.getElementById('totalInterviews').textContent = interviewsCount || 0;
    }
  } catch (error) {
    console.error('?µÍ≥Ñ Î°úÎìú ?§Ìå®:', error);
  }
}

// ?†Ï? Î™©Î°ù Î°úÎìú
async function loadUsers() {
  document.getElementById('loadingUsers').classList.add('show');
  document.getElementById('usersTable').style.display = 'none';
  document.getElementById('emptyUsers').style.display = 'none';

  try {
    // students ?åÏù¥Î∏îÏóê??user_id?Ä email??Í∞Ä?∏Ïò¥
    const { data, error } = await supabaseClient
      .from('students')
      .select('user_id, created_at')
      .order('created_at', { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      document.getElementById('loadingUsers').classList.remove('show');
      document.getElementById('emptyUsers').style.display = 'block';
      return;
    }

    // user_idÎ°?Í∑∏Î£π??    const usersMap = new Map();
    data.forEach(student => {
      if (!usersMap.has(student.user_id)) {
        usersMap.set(student.user_id, student);
      }
    });

    const tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = '';

    // Í∞?user_id???Ä??auth ?ïÎ≥¥ Í∞Ä?∏Ïò§Í∏∞Îäî Î∂àÍ??•ÌïòÎØÄÎ°?    // user_idÎß??úÏãú
    usersMap.forEach((student, userId) => {
      const tr = document.createElement('tr');
      const createdDate = new Date(student.created_at).toLocaleDateString('ko-KR');

      tr.innerHTML = `
        <td>${userId}</td>
        <td>
          <span class="badge user">?ºÎ∞ò</span>
        </td>
        <td>${createdDate}</td>
      `;

      tbody.appendChild(tr);
    });

    // Í¥ÄÎ¶¨Ïûê Ï∂îÍ?
    const adminTr = document.createElement('tr');
    adminTr.innerHTML = `
      <td>${ADMIN_EMAIL}</td>
      <td>
        <span class="badge admin">Í¥ÄÎ¶¨Ïûê</span>
      </td>
      <td>-</td>
    `;
    tbody.insertBefore(adminTr, tbody.firstChild);

    document.getElementById('loadingUsers').classList.remove('show');
    document.getElementById('usersTable').style.display = 'table';
  } catch (error) {
    console.error('?†Ï? Î™©Î°ù Î°úÎìú ?§Ìå®:', error);
    showToast('error', '?†Ï? Î™©Î°ù??Î∂àÎü¨?????ÜÏäµ?àÎã§.');
    document.getElementById('loadingUsers').classList.remove('show');
  }
}

// ?†Ï? Ï∂îÍ? Î™®Îã¨ ?¥Í∏∞
function openAddUserModal() {
  document.getElementById('addUserModal').classList.add('show');
}

// ?†Ï? Ï∂îÍ? Î™®Îã¨ ?´Í∏∞
function closeAddUserModal() {
  document.getElementById('addUserModal').classList.remove('show');

}

// ?†Ï? Ï∂îÍ?
async function handleAddUser(event) {
  event.preventDefault();

  const email = document.getElementById('newUserEmail').value.trim();
  const password = document.getElementById('newUserPassword').value;
  const passwordConfirm = document.getElementById('newUserPasswordConfirm').value;

  if (password !== passwordConfirm) {
    showToast('error', 'ÎπÑÎ?Î≤àÌò∏Í∞Ä ?ºÏπò?òÏ? ?äÏäµ?àÎã§.');
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      if (error.message.includes('already registered')) {
        showToast('error', '?¥Î? ?±Î°ù???¥Î©î?ºÏûÖ?àÎã§.');
      } else {
        showToast('error', '?†Ï? Ï∂îÍ? ?§Ìå®: ' + error.message);
      }
      return;
    }

    showToast('success', '?†Ï?Í∞Ä Ï∂îÍ??òÏóà?µÎãà??');
    closeAddUserModal();
    await loadUsers();
    await loadStats();
  } catch (error) {
    console.error('?†Ï? Ï∂îÍ? ?§Ìå®:', error);
    showToast('error', '?†Ï? Ï∂îÍ????§Ìå®?àÏäµ?àÎã§.');
  }
}

// Toast ?åÎ¶º
function showToast(type, message) {
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const msg = document.getElementById('toastMessage');

  toast.className = 'toast show ' + type;

  if (type === 'success') icon.textContent = '??;
  else if (type === 'error') icon.textContent = '??;
  else icon.textContent = '?πÔ∏è';

  msg.textContent = message;

  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}
